<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Книжная полка</title>
<meta name="description" content="Личный трекер прочитанных книг: жанры, рецензии, оценки, флажки языков, список «Хочу читать».">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#fff; --surface2:#F4F6F2; --ink:#1B2524; --muted:#5B6866; --line:#D5DBD3;
  --accent:#1D5961; --accent-ink:#fff; --gold:#B57508; --danger:#B3261E; --board:#3a3d3f; --shelf-bg:#DDE3DA;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --serif:'Literata',Georgia,'Times New Roman',serif; --sans:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121917; --surface:#1B2422; --surface2:#222C2A; --ink:#E7EDEA; --muted:#9BAAA6; --line:#33403D;
  --accent:#5FB3BD; --accent-ink:#0b1514; --gold:#E3A63A; --danger:#F2867F; --board:#0d1110; --shelf-bg:#1a2321;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.2}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;min-height:30px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-align:left}
header.top{padding:22px 0 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
header.top h1{font-size:30px}
.tagline{color:var(--muted);margin:2px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px}
.stat b{display:block;font:700 22px var(--serif)}
.stat span{color:var(--muted);font-size:13px}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner .btn{color:var(--ink)}
.warn{background:#FFF3D6;color:#5a3d00;border:1px solid #E5C26B;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
/* shelf */
.shelf{background:var(--shelf-bg);border-radius:14px;padding:18px 16px 14px;margin-bottom:22px;box-shadow:inset 0 2px 8px rgba(0,0,0,.08)}
.spines{display:flex;flex-wrap:wrap;column-gap:4px;row-gap:14px;align-content:flex-start;padding-bottom:14px;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 160px,var(--board) 160px,var(--board) 174px)}
.spine{width:36px;height:160px;flex:none;border:0;border-radius:3px 3px 0 0;padding:6px 0;color:#fff;display:flex;justify-content:center;align-items:flex-start;position:relative;
  box-shadow:inset 3px 0 0 rgba(255,255,255,.18),inset -3px 0 0 rgba(0,0,0,.2);transform-origin:bottom;animation:rise .45s ease both}
.spine span{writing-mode:vertical-rl;max-height:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px/1 var(--serif);letter-spacing:.02em}
.spine.want{opacity:.42}
.spine.reading::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:#F2B531}
.spine:hover{transform:translateY(-6px);transition:transform .15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.spine{animation:none}.spine:hover{transform:none}}
.shelf-empty{color:var(--muted);padding:30px 0;text-align:center}
/* layout */
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:10px}
.side h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 6px 8px;font-family:var(--sans)}
.glist{display:flex;flex-direction:column;gap:2px}
.gbtn{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left}
.gbtn:hover{background:var(--surface2)}
.gbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.gbtn i{font-style:normal;opacity:.7;font-size:13px}
.gdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
@media (max-width:820px){
  .side{position:static;padding:8px}.side h3{display:none}
  .glist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.gbtn{white-space:nowrap;border:1px solid var(--line)}
}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.toolbar input[type=search]{flex:1 1 220px}
.field,.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:38px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.filter::after{content:" ×"}
.group{margin-bottom:18px}
.group>header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.group>header button{background:none;border:0;display:flex;align-items:center;gap:8px;font:700 19px var(--serif);padding:2px 0}
.group>header small{color:var(--muted);font:400 14px var(--sans)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;box-shadow:var(--shadow)}
.card .cv{flex:none}
.card .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.card .t{font:700 16px/1.25 var(--serif);text-align:left;background:none;border:0;padding:0}
.card .t:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:var(--muted);font-size:13px}
.snip{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 0}
.badge{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--surface2);border:1px solid var(--line)}
.badge.reading{background:#FBE8B8;color:#5a3d00;border-color:#E5C26B}
.badge.want{background:var(--surface2)}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.stars .off{opacity:.3}
.flag{display:inline-flex;vertical-align:-3px;margin-right:5px}
.flag svg{width:21px;height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
/* covers */
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 8px 8px 4px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:center;
  padding:10% 8%;box-shadow:inset 4px 0 0 rgba(255,255,255,.25),2px 3px 8px rgba(0,0,0,.28);width:72px;background-size:cover}
.cover.lg{width:150px}
.cover b{font:700 var(--fs,11px)/1.15 var(--serif);text-shadow:0 1px 2px rgba(0,0,0,.4);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;word-break:break-word}
.cover i{font-style:normal;font-size:calc(var(--fs,11px) - 2px);opacity:.9;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cover.img{padding:0}.cover.img img{width:100%;height:100%;object-fit:cover;display:block}
.cover.lg{--fs:17px}
/* queue */
.queue{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 22px}
.queue header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.queue ol{list-style:none;margin:0;padding:0}
.qi{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qi:first-child{border-top:0}
.qn{width:26px;font:700 18px var(--serif);color:var(--muted);text-align:right}
.qi .cover{width:34px;padding:4px;--fs:5px;box-shadow:1px 1px 3px rgba(0,0,0,.25)}
.qi .cover b,.qi .cover i{display:none}
.qtext{flex:1 1 180px;min-width:0}
.qbtns{display:flex;flex-wrap:wrap;gap:6px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1px dashed var(--line);border-radius:14px}
/* modal */
dialog{border:0;border-radius:16px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:92vh}
dialog::backdrop{background:rgba(10,18,17,.55)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mhead h2{font-size:20px}
.mbody{padding:16px 18px 20px}
.xbtn{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.detail{display:flex;gap:18px}
@media (max-width:560px){.detail{flex-direction:column;align-items:center}}
.detail .info{flex:1;min-width:0;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
textarea.field{width:100%;min-height:130px;resize:vertical;font-family:var(--serif)}
.star-input{display:flex;gap:2px;margin:6px 0}
.star-input button{border:0;background:none;font-size:30px;line-height:1;color:var(--gold);padding:0 2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.form .field{color:var(--ink);width:100%}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:100;box-shadow:var(--shadow);max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
code.link{display:block;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;max-height:90px;overflow:auto}
footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0}
</style>
</head>

    const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=300;c.height=450;const x=c.getContext('2d');
      const s=Math.max(300/img.width,450/img.height),w=img.width*s,hh=img.height*s;x.drawImage(img,(300-w)/2,(450-hh)/2,w,hh);coverData=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);redraw()};
    img.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось прочитать изображение')};img.src=url}});
  const form=h('form',{class:'form',onsubmit:e=>{e.preventDefault();
    const nb=norm({...b,title:els.title.value,author:els.author.value,genre:els.genre.value,lang:els.lang.value,status:els.status.value,rating:els.rating.value,review:els.review.value,
      pages:els.pages.value,year:els.year.value,finished:els.finished.value,link:els.link.value.trim(),cover:coverData});
    if(!nb){toast('Укажите название и автора');return}
    if(nb.status==='read'&&!nb.finished)nb.finished=today();
    if(isNew){nb.id=uid();nb.added=Date.now();if(nb.status==='want')nb.queue=own.filter(x=>x.status==='want').length;own.push(nb)}
    else{const i=own.findIndex(x=>x.id===b.id);if(nb.status==='want'&&b.status!=='want')nb.queue=own.filter(x=>x.status==='want').length;own[i]=nb;if(b.status==='want'&&nb.status!=='want')stripQueue()}
    save();dlg.close();render();toast(isNew?'Книга добавлена':'Изменения сохранены')}},
    inp('title','Название *',{required:true,maxlength:200},true),inp('author','Автор *',{required:true,maxlength:160}),
    h('label',null,'Жанр',els.genre=h('input',{class:'field',value:b.genre,list:'gl',maxlength:60,placeholder:'Без жанра'}),dl),
    sel('lang','Язык',Object.entries(LANGS)),sel('status','Статус',Object.entries(STATUS)),
    sel('rating','Оценка',[['0','Без оценки'],...[1,2,3,4,5].map(n=>[String(n),'★'.repeat(n)])]),
    inp('pages','Страниц',{type:'number',min:1}),inp('year','Год издания',{type:'number',min:0,max:2100}),inp('finished','Дата прочтения',{type:'date'}),
    inp('link','Ссылка (http/https)',{type:'url',maxlength:500,placeholder:'https://'}),
    h('label',{class:'wide'},'Рецензия',els.review=h('textarea',{class:'field',maxlength:6000,value:b.review})),
    h('div',{class:'wide row',style:'align-items:end'},prev,h('div',{class:'row'},
      h('label',{for:'cvf',class:'btn',tabindex:'0',onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}}},'Загрузить обложку'),
      h('button',{type:'button',class:'btn',onclick:()=>{coverData='';redraw()}},'Автообложка'),file)),
    h('div',{class:'wide row'},h('button',{type:'submit',class:'btn primary'},isNew?'Добавить':'Сохранить'),h('button',{type:'button',class:'btn',onclick:()=>dlg.close()},'Отмена')));
  const dlg=modal(isNew?'Новая книга':'Изменить книгу',form);redraw();els.title.addEventListener('input',redraw);els.author.addEventListener('input',redraw);els.title.focus()}

/* ===== поделиться ===== */
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function pack(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if('CompressionStream' in window){const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));return'z'+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}
  return'j'+b64u(bytes)}
async function unpack(code){code=code.trim();const k=code[0],u8=unb64u(code.slice(1));let bytes=u8;
  if(k==='z'){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
  else if(k!=='j')throw new Error('format');
  return JSON.parse(new TextDecoder().decode(bytes))}
const slim=b=>[b.title,b.author,b.genre,b.lang,b.status,b.rating,b.review,b.pages,b.year,b.finished,b.link,b.art?[b.art.h,b.art.p]:0];
const unslim=a=>norm({id:uid(),title:a[0],author:a[1],genre:a[2],lang:a[3],status:a[4],rating:a[5],review:a[6],pages:a[7],year:a[8],finished:a[9],link:a[10],art:a[11]?{h:a[11][0],p:a[11][1]}:null});
function listAsText(){const t=viewing?viewing.title:listTitle,g={};books().forEach(b=>(g[b.genre]=g[b.genre]||[]).push(b));
  let s='# '+t+'\n\n';Object.keys(g).sort().forEach(n=>{s+='## '+n+'\n\n';g[n].forEach(b=>{
    s+='- **'+b.title+'** — '+b.author+' ['+b.lang.toUpperCase()+'] '+(b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating)+' ':'')+'('+STATUS[b.status].toLowerCase()+')\n';
    if(b.review)s+=b.review.split('\n').map(l=>'  > '+l).join('\n')+'\n'});s+='\n'});return s}
async function copy(text,ok){try{await navigator.clipboard.writeText(text);toast(ok)}catch(e){fallbackText('Скопируйте текст',text)}}
function fallbackText(title,text){modal(title,h('textarea',{class:'field',readonly:true,style:'min-height:240px',value:text,onfocus:e=>e.target.select()}))}
function openShare(){
  const titleIn=h('input',{class:'field',value:viewing?viewing.title:listTitle,maxlength:80,'aria-label':'Название списка',disabled:!!viewing});
  const out=h('div'),box=h('div',null,
    h('label',{style:'display:block;color:var(--muted);font-size:13px'},'Название списка',titleIn),
    h('p',{class:'meta',text:'В ссылку попадают все книги вместе с рецензиями. Собственные обложки не включаются.'}),out);
  const dlg=modal('Поделиться списком',box);
  const build=async()=>{
    if(!viewing){listTitle=titleIn.value.trim()||listTitle;save()}
    const code=await pack({v:1,t:viewing?viewing.title:listTitle,b:books().map(slim)});
    const url=location.href.split('#')[0]+'#share='+code;
    out.replaceChildren(h('code',{class:'link',text:url}),
      url.length>6000?h('p',{class:'warn',text:'Ссылка очень длинная — в мессенджере она может обрезаться. Надёжнее выгрузить список в файл.'}):null,
      h('div',{class:'row'},h('button',{class:'btn primary',onclick:()=>copy(url,'Ссылка скопирована')},'Скопировать ссылку'),
        h('button',{class:'btn',onclick:()=>copy(listAsText(),'Список скопирован как текст')},'Скопировать как текст'),
        navigator.share&&h('button',{class:'btn',onclick:()=>navigator.share({title:viewing?viewing.title:listTitle,url}).catch(()=>{})},'Отправить…')))};
  titleIn.addEventListener('change',build);build()}

/* ===== выгрузка / загрузка ===== */
function download(name,mime,text,bom){
  try{const blob=new Blob([bom?'﻿'+text:text],{type:mime+';charset=utf-8'}),a=h('a',{href:URL.createObjectURL(blob),download:name});
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Файл сохранён: '+name)}
  catch(e){fallbackText('Не удалось сохранить файл — скопируйте текст',text)}}
function toCSV(){const cols=['Название','Автор','Жанр','Язык','Статус','Оценка','Страниц','Год','Дата прочтения','Ссылка','Рецензия'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return[cols.map(q).join(';'),...books().map(b=>[b.title,b.author,b.genre,LANGS[b.lang],STATUS[b.status],b.rating||'',b.pages||'',b.year||'',b.finished,b.link,b.review].map(q).join(';'))].join('\r\n')}
function openExport(){const slug='knizhnaya-polka-'+today();
  modal('Выгрузить список',h('div',null,h('p',{class:'meta',text:'Книг: '+books().length+'. Выберите формат.'}),
    h('div',{class:'row'},
      h('button',{class:'btn',onclick:()=>download(slug+'.json','application/json',JSON.stringify({app:'bookshelf',version:1,title:viewing?viewing.title:listTitle,books:books()},null,2))},'JSON (резервная копия)'),
      h('button',{class:'btn',onclick:()=>download(slug+'.csv','text/csv',toCSV(),true)},'CSV (Excel)'),
      h('button',{class:'btn',onclick:()=>download(slug+'.md','text/markdown',listAsText())},'Markdown'))))}
function mergeBooks(list){const have=new Set(own.map(key));let added=0,skipped=0;
  list.map(norm).filter(Boolean).forEach(b=>{if(have.has(key(b))){skipped++;return}have.add(key(b));b.id=uid();b.added=Date.now()+added;if(b.status==='want')b.queue=own.filter(x=>x.status==='want').length;own.push(b);added++});
  stripQueue();save();return{added,skipped}}
function openImport(){
  const ta=h('textarea',{class:'field',placeholder:'Вставьте ссылку или код друга',style:'min-height:80px'});let dlg;
  const done=r=>{dlg.close();render();toast('Добавлено '+r.added+', уже были '+r.skipped)};
  const file=h('input',{type:'file',accept:'.json,application/json',onchange:async e=>{const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());done(mergeBooks(Array.isArray(d)?d:d.books))}catch(err){toast('Не удалось прочитать файл')}}});
  dlg=modal('Загрузить список',h('div',null,h('p',{class:'meta',text:'Книги добавятся к вашему списку, повторы будут пропущены.'}),
    h('label',null,'JSON-файл ',file),h('h3',{text:'Ссылка или код друга',style:'font-size:16px;margin-top:14px'}),ta,
    h('div',{class:'row'},h('button',{class:'btn primary',onclick:async()=>{try{
      const v=ta.value.trim(),i=v.indexOf('share=');const d=await unpack(i>=0?v.slice(i+6):v);done(mergeBooks(d.b.map(unslim)))}catch(e){toast('Не удалось распознать ссылку')}}},'Загрузить'))))}
function openMore(){let dlg;const arm=(label,fn)=>{let a=false;const b=h('button',{class:'btn danger',onclick:()=>{if(!a){a=true;b.textContent='Подтвердить: '+label;setTimeout(()=>{a=false;b.textContent=label},3500);return}fn();dlg.close()}},label);return b};
  dlg=modal('Ещё',h('div',{class:'row'},
    h('button',{class:'btn',onclick:()=>{const have=new Set(own.map(key));let n=0;seedBooks().forEach(b=>{if(!have.has(key(b))){b.id=uid();b.added=Date.now()+n;if(b.status==='want')b.queue=own.filter(x=>x.status==='want').length;own.push(b);n++}});save();dlg.close();render();toast(n?'Добавлено примеров: '+n:'Все примеры уже на полке')}},'Вернуть примеры книг'),
    arm('Очистить список',()=>{own=[];save();render();toast('Список очищен')})))}

/* ===== запуск ===== */
async function route(){
  const m=location.hash.match(/^#share=(.+)$/);
  if(m){try{const d=await unpack(m[1]);const bs=(d.b||[]).map(unslim).filter(Boolean);
      viewing={title:String(d.t||'Список друга').slice(0,80),books:bs};resetFilters();animate=true;render();return}
    catch(e){toast('Не удалось открыть ссылку со списком')}}
  if(viewing){viewing=null}render()}
load();stripQueue();route();
window.addEventListener('hashchange',()=>{animate=true;route()});
</script>
